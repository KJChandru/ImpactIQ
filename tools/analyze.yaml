name: run_agent_loop
description: Run the multi-iteration confidence-gated agent loop to analyze blast radius and impact of a proposed feature on the architecture
endpoint: /api/agent
method: POST
content_type: application/json

input_schema:
  type: object
  required: [architecture, feature]
  properties:
    architecture:
      type: object
      required: [modules, dependencies]
      properties:
        modules:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              type:
                type: string
    feature:
      type: string
      description: Plain-English description of the feature being analyzed

agent_config:
  max_iterations: 2
  confidence_threshold: 0.85
  tools:
    - trace_dependency
    - check_circular
    - estimate_blast_radius
    - generate_migration_path

output_schema:
  type: object
  required: [blastRadius, impacted, hiddenDeps, tests, deploymentRisks, agentConfidence, iterationHistory]
  properties:
    blastRadius:
      type: integer
      description: Total number of impacted modules
    impacted:
      type: array
      items:
        type: object
        properties:
          module:
            type: string
          severity:
            type: string
            enum: [high, medium, low]
          reason:
            type: string
    hiddenDeps:
      type: array
      items:
        type: object
        properties:
          from:
            type: string
          to:
            type: string
          risk:
            type: string
    tests:
      type: array
      items:
        type: object
        properties:
          module:
            type: string
          cases:
            type: array
            items:
              type: string
    deploymentRisks:
      type: array
      items:
        type: string
    agentConfidence:
      type: number
      description: Final confidence score after all iterations (0–1)
    iterationHistory:
      type: array
      description: Log of each agent iteration including tool calls, findings, and confidence
